<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finestra Centrata</title>
    <style>
        body {
            background-color: white;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .win-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .win-box {
            background-color: #262522;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            -webkit-box-shadow: 2px 2px 23px -1px #858585;
        }

        .win-box h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #ffffff;
        }

        .win-box input[type="text"] {
            width: 90%;
            color: white;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            border: none;
            background-color: transparent;
            border-bottom: 2px solid white;
            outline: none;
        }

        .win-box .button-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .win-box button {
            flex: 1;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #104503;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .win-box button.cancel {
            background-color: #a30000;
        }
    </style>
</head>

<body>
    <div class="win-message">
        <div class="win-box">
            <h2>Titolo della finestra</h2>
            <input type="text" placeholder="Inserisci qualcosa..." />
            <div class="button-group">
                <button type="button">CLASSIFICA</button>
                <button type="button" class="cancel">RIGIOCA</button>
            </div>
        </div>
    </div>
</body>

</html>
